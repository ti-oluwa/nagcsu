[project]
name = "nagcsu"
version = "0.0.1"
description = "History matching and storage-cycling CLI for the N/AGCSU Phase 2 UGH-1 sector model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "res2df>=1.0",
    "resfo>=4.0",
    "rich>=13.0",
    "scipy>=1.13",
]

[project.scripts]
nagcsu = "nagcsu.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nagcsu"]
